frr defaults traditional
hostname r3
log stdout
service integrated-vtysh-config
!
interface lo
 ip address 3.3.3.3/32
 ip ospf area 0
!
interface eth1
 description to-r2
 ip address 10.0.0.6/30
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 3.3.3.3
 passive-interface lo
!
line vty
!
