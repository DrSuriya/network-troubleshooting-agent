frr defaults traditional
hostname r2
log stdout
service integrated-vtysh-config
!
interface lo
 ip address 2.2.2.2/32
 ip ospf area 0
!
interface eth1
 description to-r1
 ip address 10.0.0.2/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 description to-r3
 ip address 10.0.0.5/30
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 2.2.2.2
 passive-interface lo
!
line vty
!
