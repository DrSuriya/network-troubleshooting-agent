frr defaults traditional
hostname r1
log stdout
service integrated-vtysh-config
!
interface lo
 ip address 1.1.1.1/32
 ip ospf area 0
!
interface eth1
 description to-r2
 ip address 10.0.0.1/30
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 1.1.1.1
 passive-interface lo
!
line vty
!
